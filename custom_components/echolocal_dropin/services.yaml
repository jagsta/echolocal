call:
  fields:
    caller_device:
      required: true
      selector:
        text:
    caller_room:
      required: true
      selector:
        text:
    callee_device:
      required: true
      selector:
        text:
    callee_room:
      required: true
      selector:
        text:
    session_id:
      required: false
      selector:
        text:
announce:
  # t_47f64032 / D-ANN-2: Alexa-semantics announcement. The INVOKING dot is
  # the origin (it records + serves the capture); bare announce replays to
  # ALL OTHER registered echolocal dots, "announce to <room>" to that one
  # dot. Targets are the drop-in directory ONLY (device_map) — no other
  # media_player targets, ever.
  fields:
    caller_device:
      required: true
      selector:
        text:
    caller_room:
      required: false
      selector:
        text:
    target_room:
      required: false
      selector:
        text:
dial:
  # t_3c196f3e / D-DI-6 offline-at-dial: resolves the callee up front
  # (area_aliases.json -> dot) and refuses an unknown or dotless room with a
  # clean service error; an OFFLINE dot reports TTS "… isn't available" at
  # the caller with no session started. Never registers a phantom endpoint.
  fields:
    caller_device:
      required: true
      selector:
        text:
    caller_room:
      required: false
      selector:
        text:
    callee_device:
      required: false
      selector:
        text:
    callee_room:
      required: true
      selector:
        text:
    session_id:
      required: false
      selector:
        text:
accept:
  fields:
    session_id:
      required: true
      selector:
        text:
    device:
      required: true
      selector:
        text:
voice_answer:
  fields:
    device:
      required: false
      selector:
        text:
    room:
      required: false
      selector:
        text:
voice_hangup:
  fields:
    device:
      required: false
      selector:
        text:
    room:
      required: false
      selector:
        text:
hangup:
  fields:
    session_id:
      required: true
      selector:
        text:
    device:
      required: false
      selector:
        text:
set_permission:
  fields:
    source:
      required: true
      selector:
        text:
    target:
      required: true
      selector:
        text:
    mode:
      required: true
      selector:
        select:
          options:
            - allow_household
            - allow
            - deny