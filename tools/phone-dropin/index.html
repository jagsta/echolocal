<!doctype html>
<!--
  Phone drop-in dialer (cards 7+9, D-DI-8/D-DI-9c-d, specs/phone-dropin-webrtc.md,
  specs/phone-dropin-ux-decisions.md). Served from the dot's web server
  (/call/phone-dropin) or opened straight from file:// — no build step.

  Card 9 (D-DI-9c/d): zero-discovery dialer driven ENTIRELY by query params —
    ?host=<ip-or-host>&room=<room-id>&name=<display-name>
  host is the target dot to dial; room/name are display only (the CALLEE dot
  announces itself). Absent or invalid host = friendly error, never dials.
  NO directory logic: no rooms.json fetch, no localStorage room list, no dot
  discovery — the HA Lovelace tiles are the directory; each tile is a
  self-contained deep link with host/room/name baked in. NO auto-dial: the
  page pre-selects the room and shows a large confirm button; only the
  explicit tap starts the offer. The pairing key is stored in localStorage
  keyed per host (host->key) after a successful dial, so it is entered once
  per dot per phone.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EchoLocal drop-in</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #181b1f; color: #eee;
         display: flex; flex-direction: column; align-items: center;
         justify-content: center; height: 100dvh; margin: 0; }
  h1 { font-size: 1.1em; color: #9e9e9e; }
  button { font-size: 1.4em; padding: 1em 2.6em; border-radius: 999px;
           border: 0; margin: .4em; }
  #call { background: #2e7d32; color: #fff; font-size: 1.6em;
          padding: 1.2em 3em; }
  #call.active { background: #b71c1c; }
  #mute { background: #37474f; color: #fff; }
  #mute.off { background: #f9a825; color: #111; }
  input { font-size: 1.1em; padding: .6em; border-radius: 8px; border: 1px solid #555;
          width: min(320px, 80vw); margin: .3em; background: #22262b; color: #eee; }
  #status { min-height: 1.4em; color: #9e9e9e; margin-top: .8em; }
  #error { color: #ef9a9a; font-size: 1.1em; max-width: 90vw; text-align: center; }
  .row { display: flex; gap: .3em; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>EchoLocal drop-in</h1>
  <div id="error" class="hidden"></div>
  <div class="row">
    <input id="key" placeholder="pairing key" autocomplete="off">
  </div>
  <button id="call" class="hidden">Call</button>
  <div class="row">
    <button id="mute" class="hidden">Mute</button>
    <button id="hang" class="hidden">Hang up</button>
  </div>
  <div id="status"></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const key = $("key"), call = $("call"),
        mute = $("mute"), hang = $("hang"), status = $("status"), error = $("error");
  let pc = null, mic = null, callId = null, timer = null;

  // Card 9: the page is parameter-driven — no dot input box, no directory.
  // ?host=<ip-or-host>&room=<room-id>&name=<display-name>
  const params = new URLSearchParams(location.search);
  const host = (params.get("host") || "").trim();
  const room = (params.get("room") || "").trim();
  const name = (params.get("name") || "").trim() || room || host;

  // host must be a hostname/IP-ish token; anything that looks unsafe or is
  // missing means a friendly error and the page never dials (D-DI-9c).
  const hostOk = /^[A-Za-z0-9._-]{1,253}$/.test(host);

  const say = (m) => { status.textContent = m; };
  const showFatal = (m) => {
    error.textContent = m;
    error.classList.remove("hidden");
    call.classList.add("hidden");
    say("cannot dial — fix the link");
  };

  try { // the pairing key persists in the browser, not on file:// in some engines
    if (!key.value) key.value = localStorage.getItem("key:" + host) || "";
  } catch (_) {}

  const remember = () => {
    try { localStorage.setItem("key:" + host, key.value); } catch (_) {}
  };

  // 30-minute idle auto-end, mirroring the callee max_minutes kill-switch.
  const armTimer = () => {
    clearTimeout(timer);
    timer = setTimeout(() => { say("ended automatically (30 min max)"); end(); },
                      30 * 60 * 1000);
  };

  const post = async (path, extra) => {
    // Card 11: HTTPS signalling — the page may come from the secure HA origin,
    // where Chromium blocks plain-HTTP fetches (mixed content). The dot serves
    // the same routes over TLS on :443 with a self-signed cert: the first
    // visit shows a certificate warning; proceed/accept once and it persists.
    const r = await fetch(`https://${host}${path}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({
        // D-DI-9b: name is claimed here but IGNORED server-side — the
        // matched pairing key's entry IS the identity (anti-spoof).
        call: callId, from: "phone:" + name, name: name, pairing: key.value
      }, extra))
    });
    if (!r.ok) throw new Error(`${path} -> ${r.status}`);
    return r;
  };

  function setupPage() {
    if (!hostOk) {
      showFatal("Link is missing a valid host. Open this page from a Home " +
                "Assistant tile deep link of the form " +
                "…/call/phone-dropin?host=<dot-address>&room=<room>&name=<label>.");
      return;
    }
    document.title = "Call " + name + " — EchoLocal";
    key.value = key.value; // keep any stored key pre-filled
    // NO auto-dial (D-DI-9d): pre-select the room, show the big confirm
    // button; only an explicit tap starts the offer.
    call.textContent = "Call " + name;
    call.classList.remove("hidden");
    say("ready to call " + name);
  }

  async function start() {
    if (!hostOk) { showFatal("invalid host"); return; }
    if (!key.value) { say("enter the pairing key first"); return; }
    say("asking for the microphone…");
    try {
      mic = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) { say("microphone refused: " + e.message); return; }
    callId = "phone-" + Math.random().toString(36).slice(2, 10);
    pc = new RTCPeerConnection();
    mic.getTracks().forEach((t) => pc.addTrack(t, mic));
    pc.addTransceiver("audio", { direction: "recvonly" }); // hear the Dot
    pc.ontrack = (e) => {
      const a = new Audio();
      a.srcObject = e.streams[0];
      a.play();
    };
    pc.onconnectionstatechange = () => {
      say("link: " + pc.connectionState);
      if (["failed", "closed"].includes(pc.connectionState)) end();
    };
    say("ringing…");
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    // The answer SDP comes back in this same response (the dot holds the
    // offer open until its callee accepts).
    const r = await post("/call/offer", { sdp: pc.localDescription.sdp });
    const answer = await r.json();
    if (!answer.sdp) { say("no answer from the dot"); end(); return; }
    await pc.setRemoteDescription(
      { type: "answer", sdp: answer.sdp });
    // Successful dial: store the pairing key per host (host -> key) so it is
    // entered once per dot on this phone.
    remember();
    say("connected");
    call.textContent = "Connected — tap to end";
    call.classList.add("active");
    mute.classList.remove("hidden");
    hang.classList.remove("hidden");
    call.disabled = true;
    armTimer();
  }

  function end() {
    clearTimeout(timer);
    const id = callId;
    callId = null;
    if (pc) { try { pc.close(); } catch (_) {} pc = null; }
    if (mic) { mic.getTracks().forEach((t) => t.stop()); mic = null; }
    if (id && hostOk) {
      post("/call/end", { reason: "hangup" }).catch(() => {});
    }
    say("idle");
    call.textContent = "Call " + name;
    call.classList.remove("active");
    call.disabled = false;
    mute.classList.add("hidden");
    hang.classList.add("hidden");
    mute.textContent = "Mute";
  }

  call.addEventListener("click", () => {
    start().catch((e) => { say(e.message); end(); });
  });
  hang.addEventListener("click", () => { say("hanging up"); end(); });
  mute.addEventListener("click", () => {
    if (!mic) return;
    const t = mic.getTracks()[0];
    t.enabled = !t.enabled;
    mute.textContent = t.enabled ? "Mute" : "Unmute";
    mute.classList.toggle("off", !t.enabled);
  });
  setupPage();
})();
</script>
</body>
</html>
